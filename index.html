<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Game Picker</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400..900&display=swap" rel="stylesheet">
</head>
<body>
    

    <h1>Game Picker</h1>

    <div class="main">
        <h2>Don't know which game to play?</h2>
        <button>Suggest me a game</button>
    </div>

    <div class="select">
        <h2>What type of game do you wanna play?</h2>
        <button>Competitive Game</button>
        <button>Story Game</button>
    </div>

    <div class="final">
        <h2>Your game is: </h2>
        <p>Game name</p>
        <p>Didn't like it?</p>
        <button>Try again.</button>
    </div>


</body>
</html>
