<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Game Picker</title>
    
</head>
<body>
    

    <h1>Game Picker</h1>

    <div>
        <h2>Don't know which game to play?</h2>
        <button>Suggest me a game</button>
    </div>

    <div>
        <h2>What type of game do you wanna play?</h2>
        <button>Competitive Game</button>
        <button>Story Game</button>
    </div>

    <div>
        <h2>Your game is: </h2>
        <p>Game name</p>
        <p>Didn't like it?</p>
        <button>Try again.</button>
    </div>


</body>
</html>
